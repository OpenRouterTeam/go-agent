name: Upstreamer Port

# Ports @openrouter/agent into this repo.
#
# The port tracks upstream's **default-branch HEAD**, not the latest published npm
# release. Release tracking sounds safer but produces exactly the failure this
# pipeline exists to prevent: upstream can sit for weeks with large unreleased
# work on main (doom-loop detection, #73, was ~7.5k lines) and the port stays
# blind to it, then absorbs the whole delta in one automated run touching the most
# load-bearing modules. Tracking HEAD keeps each delta small enough to review.
#
# Consequence to keep in mind: the port is then routinely AHEAD of the latest
# release, so the release tag matching its ported surface legitimately lags
# upstream's package.json. The verifier reports that rather than failing — Go
# modules carry no version field, so there is nothing to drift, but tagging a
# release from an ahead-of-tag tree would still misrepresent it.
#
# Three triggers, all resolving to HEAD unless given an explicit ref:
#   1. Weekly cron — the primary path now that releases are not the trigger.
#   2. repository_dispatch from typescript-agent's publish.yaml on a new npm
#      release. Still useful as a "something just shipped, sync promptly" nudge,
#      but it no longer pins the ref to that release tag: doing so would port
#      BACKWARDS once the port is ahead of the release. scripts/upstream refuses
#      an ancestor ref outright.
#   3. Manual dispatch, optionally with an explicit ref.
#
# Opens a PR. Never pushes to main. A failed parity eval leaves
# .upstreamer/state.yaml unchanged, so the next run retries the same delta.
# A converter that times out or aborts still pushes its partial tree, labelled
# port-incomplete, so the work is inspectable rather than lost with the runner.

on:
  repository_dispatch:
    types: [openrouter-agent-published]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:
    inputs:
      ref:
        description: "Upstream ref to port (blank = upstream default branch HEAD)"
        required: false
        type: string
      force:
        description: "Re-run even if the upstream commit is unchanged"
        required: false
        default: false
        type: boolean
      timeout_minutes:
        description: "Converter time limit in minutes (max 300). Raise for large upstream ranges."
        required: false
        default: "120"
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write # to dispatch ci.yaml onto the generated PR branch

concurrency:
  group: upstreamer-port
  cancel-in-progress: false

jobs:
  port:
    runs-on: ubuntu-latest
    # Must exceed the converter limit (timeout_minutes, max 300) plus setup and
    # PR steps. If the JOB times out, nothing after the port step runs and all
    # partial work is lost, so the converter's own alarm must always fire first.
    timeout-minutes: 330
    env:
      # Surfaced as env because the `secrets` context is NOT available in a
      # step-level `if:` (only github/needs/strategy/matrix/job/runner/env/vars/
      # steps/inputs are). Referencing secrets.* there evaluates to empty and the
      # condition silently never matches — so the App-token gate below tests this
      # variable instead. Only ever compared against '' ; never echoed.
      HAS_APP_KEY: ${{ secrets.PORT_BOT_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Install opencode
        run: bun install -g opencode-ai

      - name: Set up language toolchain
        uses: ./.github/actions/port-toolchain

      # Blank ref = upstream default-branch HEAD, which scripts/upstream resolves
      # itself. That is the normal case for both the cron and a publish dispatch.
      #
      # Only an EXPLICIT manual `ref` input is honored. The publish dispatch's
      # client_payload.ref is deliberately ignored: it carries the release tag,
      # which is an ancestor of HEAD once the port is ahead of the release, so
      # honoring it would revert landed work. The dispatch still does its real
      # job — waking the pipeline promptly after a release — it just syncs to HEAD
      # like every other trigger. (scripts/upstream also refuses an ancestor ref
      # outright, so this is defense in depth, not the only guard.)
      - name: Resolve target ref
        id: target
        run: |
          set -euo pipefail
          REF="${{ inputs.ref }}"
          if [ -n "$REF" ]; then
            echo "Explicit ref requested: $REF"
          else
            PAYLOAD_REF="${{ github.event.client_payload.ref }}"
            if [ -n "$PAYLOAD_REF" ]; then
              echo "::notice::Ignoring dispatch payload ref '$PAYLOAD_REF' — this port tracks upstream HEAD, and a release tag is an ancestor once the port is ahead of it. Syncing to HEAD instead."
            fi
            echo "No explicit ref — porting upstream default-branch HEAD."
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      # A timed-out or aborted converter does NOT fail this step. Its exit code is
      # recorded instead, so the partial tree is still committed and pushed to the
      # PR below (labelled port-incomplete) rather than discarded with the runner.
      # The last step fails the job afterwards.
      - name: Run port
        id: port
        env:
          # Provide these in repo settings:
          #   Secret   OPENROUTER_API_KEY  — sk-or-... key opencode uses for inference
          #   Variable OPENCODE_MODEL      — e.g. openrouter/~anthropic/claude-opus-latest
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL }}
          TIMEOUT_MINUTES: ${{ inputs.timeout_minutes || '120' }}
        run: |
          set -euo pipefail
          if [ -z "${OPENROUTER_API_KEY:-}" ]; then
            echo "::error::OPENROUTER_API_KEY secret is not set. See .upstreamer/port.env.example."
            exit 1
          fi
          case "$TIMEOUT_MINUTES" in
            ''|*[!0-9]*) echo "::error::timeout_minutes must be a whole number, got '$TIMEOUT_MINUTES'"; exit 1 ;;
          esac
          if [ "$TIMEOUT_MINUTES" -lt 1 ] || [ "$TIMEOUT_MINUTES" -gt 300 ]; then
            echo "::error::timeout_minutes must be between 1 and 300 (the job limit is 330), got $TIMEOUT_MINUTES"
            exit 1
          fi
          export UPSTREAMER_TIMEOUT_SECONDS=$((TIMEOUT_MINUTES * 60))
          # Only pass --ref when there is actually a ref. `--ref ""` is not the
          # same as omitting it: the arg parser consumes the empty value and the
          # script would target an empty ref instead of defaulting to HEAD.
          args=()
          REF="${{ steps.target.outputs.ref }}"
          [ -n "$REF" ] && args+=(--ref "$REF")
          [ "${{ inputs.force }}" = "true" ] && args+=(--force)
          rc=0
          ./scripts/upstream ${args[@]+"${args[@]}"} || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          case "$rc" in
            0) ;;
            142) echo "::error::Converter hit the ${TIMEOUT_MINUTES}-minute limit. Partial work will be pushed to a port-incomplete PR. Re-run with a narrower ref or a larger timeout_minutes." ;;
            4) echo "::error::Converter aborted (opencode ended on an error but exited 0). Partial work will be pushed to a port-incomplete PR." ;;
            *) echo "::error::scripts/upstream exited $rc. Any partial work will be pushed to a port-incomplete PR." ;;
          esac

      - name: Check for changes
        id: diff
        run: |
          if [ -n "$(git status --porcelain -- . ':!tmp')" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes — upstream unchanged or port was a no-op."
          fi

      # Three outcomes, labelled distinctly:
      #   incomplete  — the converter did not finish (timeout, abort, error). The
      #                 eval never ran to completion, so this says nothing about
      #                 parity; the partial tree is pushed for inspection only.
      #   eval-failed — the converter finished but state.yaml did not advance, so
      #                 the verifier or the parity eval did not pass.
      #   passed      — state.yaml advanced.
      - name: Classify outcome
        if: steps.diff.outputs.changed == 'true'
        id: gate
        env:
          PORT_RC: ${{ steps.port.outputs.rc }}
        run: |
          set -euo pipefail
          base="port: sync with @openrouter/agent upstream"
          if [ "${PORT_RC:-1}" != "0" ]; then
            # An unfinished run must never advance the port pointer, even if the
            # converter happened to write state.yaml before it died.
            git checkout -- .upstreamer/state.yaml
            {
              echo "status=incomplete"
              echo "passed=false"
              echo "title=$base (INCOMPLETE — converter did not finish, do not merge)"
              echo "commit=port: partial sync with @openrouter/agent upstream (incomplete)"
              echo "labels=upstreamer, automated, port-incomplete"
            } >> "$GITHUB_OUTPUT"
            echo "::warning::Converter exited $PORT_RC — pushing partial work as port-incomplete."
          elif git diff --quiet -- .upstreamer/state.yaml; then
            {
              echo "status=eval-failed"
              echo "passed=false"
              echo "title=$base (EVAL FAILED — do not merge)"
              echo "commit=$base"
              echo "labels=upstreamer, automated, eval-failed"
            } >> "$GITHUB_OUTPUT"
            echo "::warning::state.yaml did not advance — parity eval did not pass. See .upstreamer/eval-report.md."
          else
            {
              echo "status=passed"
              echo "passed=true"
              echo "title=$base"
              echo "commit=$base"
              echo "labels=upstreamer, automated"
            } >> "$GITHUB_OUTPUT"
          fi

      # Mint a GitHub App installation token so the PR is created by the App
      # rather than by the native GITHUB_TOKEN.
      #
      # Why this exists: GitHub does not trigger workflows from events created
      # with GITHUB_TOKEN (recursion guard), so a PR opened with it gets no
      # pull_request-event checks. Measured on python-agent PR #24, which runs the
      # same pipeline: the commit had 14 check-runs while the PR's rollup showed
      # 7 — the workflow_dispatch half was invisible to the PR. So the "dispatch
      # ci.yaml explicitly" fallback below produces a green run that is not
      # attached to the PR, which is materially worse here than on python-agent:
      # main is not branch-protected on this repo, so nothing stops a reviewer
      # from merging an automated port PR whose checks appear absent or, worse,
      # reading a dispatched green run as if it had gated this diff.
      #
      # An App installation token is not recursion-guarded, so the PR gets real
      # pull_request checks. Preferred over a PAT: scoped to this repo, not tied to
      # a person's account, and independently revocable.
      #
      # Optional by design — see the fallback below.
      - name: Mint App token
        id: app-token
        # Gate on BOTH halves. Gating on the App ID alone is a trap: the ID is a
        # variable and the key is a secret, so they are added in separate places
        # and one routinely lands first (that is the state right now — the ID is
        # set on this repo, the key is not). With only the ID set, this step would
        # run and fail on the missing key, turning a working fallback into a
        # broken pipeline — worse than no App at all.
        if: >-
          steps.diff.outputs.changed == 'true'
          && vars.PORT_BOT_APP_ID != ''
          && env.HAS_APP_KEY == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.PORT_BOT_APP_ID }}
          private-key: ${{ secrets.PORT_BOT_PRIVATE_KEY }}

      - name: Open PR
        id: open-pr
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          # App token when configured; GITHUB_TOKEN otherwise. With the fallback
          # the PR still opens, but its checks will not attach — the guard step
          # below says so loudly rather than leaving a PR that looks unchecked
          # (or falsely checked) with no explanation.
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          branch: upstreamer/sync
          delete-branch: true
          title: ${{ steps.gate.outputs.title }}
          commit-message: ${{ steps.gate.outputs.commit }}
          labels: ${{ steps.gate.outputs.labels }}
          body: |
            Automated Upstreamer port of `@openrouter/agent` into this repo.

            - Outcome: **${{ steps.gate.outputs.status }}** (converter exit code `${{ steps.port.outputs.rc }}`)
            - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} (logs in the `upstreamer-logs` artifact)
            - Contract: `.upstreamer/upstreamer.md`
            - Parity eval: `.upstreamer/eval-report.md`
            - Parity eval passed: **${{ steps.gate.outputs.passed }}**

            `port-incomplete` means the converter was cut off (time limit, abort, or
            error) before it finished, so this tree is partial work and the eval
            result above is not meaningful. `eval-failed` means the converter
            finished but the verifier or the parity eval did not pass.

            Review the diff as a port, not as a normal PR: check behavioral parity
            against the TypeScript reference, not just that it compiles. If
            `.upstreamer/state.yaml` did not advance, the eval did not pass and this
            PR must not be merged as-is.

      # Fallback path only. With the App configured, the PR above already has real
      # pull_request checks and nothing here runs.
      #
      # Without it, the dispatched run below does NOT attach to the PR. It gives a
      # human something to read, but it is not a check on that diff — and since
      # main here is unprotected, an unattached green run is easy to mistake for
      # one. Say that plainly rather than letting the PR look gated.
      - name: Trigger CI on the port PR (no App token — checks will not attach)
        if: >-
          steps.diff.outputs.changed == 'true'
          && steps.open-pr.outputs.pull-request-operation != 'none'
          && steps.app-token.outputs.token == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::warning::PORT_BOT_APP_ID / PORT_BOT_PRIVATE_KEY are not configured, so this PR was opened with GITHUB_TOKEN and will receive NO pull_request-event checks. The dispatched run below is informational only and does not gate this diff — do not read it as a passing check. Configure the App (see PORTING.md) or close and reopen the PR by hand to generate real checks."
          gh workflow run ci.yaml --repo "$GITHUB_REPOSITORY" --ref upstreamer/sync

      # create-pull-request only ever ADDS labels, so a PR reused across runs
      # would keep a stale outcome label. Drop the ones that no longer apply.
      - name: Clear stale outcome labels
        if: >-
          steps.diff.outputs.changed == 'true'
          && steps.open-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.open-pr.outputs.pull-request-number }}
          STATUS: ${{ steps.gate.outputs.status }}
        run: |
          for label in eval-failed port-incomplete; do
            [ "$label" = "$STATUS" ] && continue
            gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label "$label" 2>/dev/null || true
          done

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstreamer-logs
          path: .upstreamer/logs/
          if-no-files-found: ignore

      # The port step records a converter failure instead of failing, so that the
      # partial work above still gets pushed. Fail the job here so the run is red.
      - name: Fail if the converter did not finish
        if: steps.port.outputs.rc != '0'
        env:
          PORT_RC: ${{ steps.port.outputs.rc }}
        run: |
          echo "::error::Converter did not finish (exit $PORT_RC). See the port-incomplete PR, if any, and the upstreamer-logs artifact."
          exit 1
