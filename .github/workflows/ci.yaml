name: CI

# This repo had no CI. Without it the port verifier's go test/vet calls only ever
# ran inside the sync job, so a generated PR reached review with no independent
# signal. This runs the same checks on every PR and push.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l . | grep -v '^tmp/' || true)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed: $unformatted"
            exit 1
          fi

      - run: go build ./...
      - run: go vet ./...

      # Deterministic tests. e2e_test.go skips without OPENROUTER_API_KEY +
      # OPENROUTER_AGENT_E2E=1, so this stays free and hermetic.
      #
      # -count=1 defeats Go's test cache: a cached "ok" says the tests passed
      # for some earlier tree, not this one.
      # -shuffle=on catches order-dependent tests, which get easier to write
      # as the suite grows.
      - name: Tests (shuffled, uncached)
        run: go test -count=1 -shuffle=on ./...

      # The race detector, blocking. This package's whole job is concurrent
      # stream fan-out plus a hooks manager documented as concurrency-safe, so a
      # data race here is a real defect -- and a plain `go test` reports it as a
      # pass. Slower than the run above, hence separate rather than merged.
      - name: Race detector
        run: go test -race -count=1 ./...

      # Coverage ratchet + per-required-symbol coverage. Shares one script with
      # the port sync so hand-written PRs and generated ports are held to the
      # same bar; see .upstreamer/scripts/verify.sh for what the two gates mean.
      - name: Coverage gates
        run: |
          go test -count=1 -coverprofile=cover.out ./...
          total=$(go tool cover -func=cover.out | awk '/^total:/ {gsub("%","",$NF); print $NF}')
          floor=$(tr -d '[:space:]' < .upstreamer/coverage-floor.txt)
          echo "coverage ${total}% (floor ${floor}%)"
          awk -v t="$total" -v f="$floor" 'BEGIN{exit !(t+0 < f+0)}' && {
            echo "::error::coverage ${total}% is below the floor ${floor}%; add tests rather than lowering the floor"
            exit 1
          }
          awk -v t="$total" -v f="$floor" 'BEGIN{exit !(t+0 >= f+0 + 1.5)}' && {
            echo "::error::coverage rose to ${total}%; raise the floor in .upstreamer/coverage-floor.txt to lock it in"
            exit 1
          }
          echo "### Coverage \`${total}%\` (floor \`${floor}%\`)" >> "$GITHUB_STEP_SUMMARY"

  # staticcheck catches correctness and concurrency smells `go vet` misses.
  # Pinned: an unpinned linter turns an upstream release into a surprise red CI
  # on an unrelated PR.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...

  # Live end-to-end tests against the real OpenRouter API: streaming, a real
  # tool round, approval pause/resume, lifecycle hooks, state serialization
  # round-trip. Costs a few cents per run (small model, short prompts).
  #
  # Warns and exits 0 when the secret is missing (e.g. PRs from forks, where
  # GitHub withholds secrets) instead of failing — same pattern as upstream
  # typescript-agent's e2e job.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Live e2e tests
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_AGENT_E2E: "1"
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::warning::OPENROUTER_API_KEY is not set; skipping live e2e tests."
            exit 0
          fi
          go test -run 'TestE2E' -v .

  # The port's own mechanical gate, blocking in both places it runs: here on every
  # PR, and inside the sync job (scripts/upstream) where it decides whether
  # state.yaml advances.
  #
  # It was advisory while the port sat a minor version behind upstream and the
  # required-API check failed by design. That gap closed with the 0.8.0 port and
  # the verifier now passes clean, so continue-on-error only bought the ability to
  # regress the parity floor with a green PR. The upstream-dependent sections
  # (release-tag position, test-cluster parity) SKIP without an upstream checkout
  # rather than fail, so a plain actions/checkout is enough to run this.
  verify-port:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/port-toolchain
      - name: Port verifier
        id: verify
        run: |
          set -o pipefail
          ./.upstreamer/scripts/verify.sh 2>&1 | tee /tmp/verify.log

      - name: Summarize
        if: always()
        run: |
          {
            echo "## Port verifier"
            echo
            if [ "${{ steps.verify.outcome }}" = "success" ]; then
              echo "Port is in sync with its parity floor."
            else
              echo "Parity floor violated — see the failures below. This blocks the PR:"
              echo "fix the gap rather than lowering the gate."
            fi
            echo
            echo '```'
            cat /tmp/verify.log 2>/dev/null || echo "(no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
